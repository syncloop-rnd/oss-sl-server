# JVM Runtime Mode Configuration
# Use server-class JVM for better performance in long-running applications
-server

# Memory Configuration
# Set initial heap size to 2GB
#-Xmx2G
# Set maximum heap size to 6GB
-Xmx6G
# Set maximum direct memory (off-heap) to 1GB
-XX:MaxDirectMemorySize=4G

# Experimental and Preview Features
# Enable access to experimental JVM options
-XX:+UnlockExperimentalVMOptions
#Increase Young Gen
-XX:NewRatio=1
# Enable JVM Compiler Interface for GraalVM integration
#-XX:+EnableJVMCI
-XX:MaxGCPauseMillis=50
-XX:G1ReservePercent=20
-XX:+UnlockExperimentalVMOptions
-XX:G1NewSizePercent=40
-XX:+UseZGC
# Enable preview language features
--enable-preview
# Add vector API incubator module for SIMD operations
--add-modules=jdk.incubator.vector

# Module System Access Configuration (--add-opens)
# Open java.io package for reflective access
--add-opens=java.base/java.io=ALL-UNNAMED
# Open java.lang package for reflective access
--add-opens=java.base/java.lang=ALL-UNNAMED
# Open java.nio package for reflective access
--add-opens=java.base/java.nio=ALL-UNNAMED
# Open java.util package for reflective access
--add-opens=java.base/java.util=ALL-UNNAMED
# Open concurrent utilities for reflective access
--add-opens=java.base/java.util.concurrent=ALL-UNNAMED
# Open concurrent locks for reflective access
--add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED
# Open internal miscellaneous classes for frameworks
--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
# Open NIO channel internals for network libraries
--add-opens=java.base/sun.nio.ch=ALL-UNNAMED
# Open reflection internals for serialization frameworks
--add-opens=java.base/sun.reflect.generics.reflectiveObjects=ALL-UNNAMED
# Open JMX internals for management tools
--add-opens=java.management/com.sun.jmx.mbeanserver=ALL-UNNAMED
# Open JVM statistics monitoring for profiling tools
--add-opens=jdk.internal.jvmstat/sun.jvmstat.monitor=ALL-UNNAMED
# Open management internals for monitoring applications
--add-opens=jdk.management/com.sun.management.internal=ALL-UNNAMED

# Allow ignite access java private methods using reflection
--add-opens=java.sql/java.sql=ALL-UNNAMED
--add-opens=java.base/java.time=ALL-UNNAMED
--add-opens=java.base/java.math=ALL-UNNAMED

# Application Configuration Properties
# Disable community deployment mode
-DCOMMUNITY_DEPLOYMENT=false
# Disable container deployment mode
-DCONTAINER_DEPLOYMENT=false
# Enable container-on-premises deployment mode
-DCONTAINER_ON_PRIM_DEPLOYMENT=true
# Enable core deployment features
-DCORE_DEPLOYMENT=true
-DQA_DEPLOYMENT=false
# Network and Protocol Configuration
# Prefer IPv4 over IPv6 for network operations
-Djava.net.preferIPv4Stack=true
# Allow setting restricted HTTP headers
-Djdk.httpclient.allowRestrictedHeaders=host,connection,content-length,expect,upgrade

# Security and Authentication Configuration
# Disable LDAP endpoint identification for legacy systems
-Dcom.sun.jndi.ldap.object.disableEndpointIdentification=true

# System Integration Configuration
# Run in headless mode (no GUI components)
-Djava.awt.headless=true
# Enable NTFS Alternate Data Streams support on Windows
-Djdk.io.File.enableADS=true
# Use Little CMS color management system
-Dsun.java2d.cmm=sun.java2d.cmm.lcms.LcmsServiceProvider

# GraalVM/Polyglot Configuration
# Suppress warnings when running in interpreter-only mode
-Dpolyglot.engine.WarnInterpreterOnly=false