"Marks the field, argument, input field or enum value as deprecated"
directive @deprecated(
    "The reason for the deprecation"
    reason: String = "No longer supported"
  ) on FIELD_DEFINITION | ARGUMENT_DEFINITION | ENUM_VALUE | INPUT_FIELD_DEFINITION

"Directs the executor to include this field or fragment only when the `if` argument is true"
directive @include(
    "Included when true."
    if: Boolean!
  ) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT

"Directs the executor to skip this field or fragment when the `if` argument is true."
directive @skip(
    "Skipped when true."
    if: Boolean!
  ) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT

"Exposes a URL that specifies the behaviour of this scalar."
directive @specifiedBy(
    "The URL that specifies the behaviour of this scalar."
    url: String!
  ) on SCALAR

type Query {
  categories: categories
  license: license
  metrics: metrics
  owner: owner
  plugin: plugin
  plugin_categories: plugin_categories
  plugin_tags: plugin_tags
  purchase_rule: purchase_rule
  screenshots: screenshots
  tag: tag
}

type categories {
  category_name: String
  category_plugin_categories: [plugin_categories]
  id: Int
}

type license {
  description: String
  id: Int
  plugin: plugin
  plugin_id: Int
}

type metrics {
  id: Int
  metric_name: String
  plugin: plugin
  plugin_id: Int
}

type owner {
  id: Int
  plugin: plugin
  plugin_id: Int
  privacy_policy: String
  published_by: String
  verified: String
  website: String
}

type plugin {
  created_on: String
  deleted: String
  description: String
  digest: String
  file: String
  id: Int
  installing_path: String
  latest_version: String
  latest_version_number: Int
  modified_on: String
  name: String
  name_slug: String
  plugin_license: [license]
  plugin_metrics: [metrics]
  plugin_owner: [owner]
  plugin_plugin_categories: [plugin_categories]
  plugin_plugin_tags: [plugin_tags]
  plugin_purchase_rule: [purchase_rule]
  plugin_screenshots: [screenshots]
  service: String
  short_description: String
  unique_id: String
  vendor: String
}

type plugin_categories {
  category: categories
  category_id: Int
  plugin: plugin
  plugin_id: Int
}

type plugin_tags {
  plugin: plugin
  plugin_id: Int
  tag: tag
  tag_id: Int
}

type purchase_rule {
  cost_type: String
  id: Int
  plugin: plugin
  plugin_id: Int
}

type screenshots {
  id: Int
  plugin: plugin
  plugin_id: Int
  screenshot: String
}

type tag {
  id: Int
  tag_name: String
  tag_plugin_tags: [plugin_tags]
}
