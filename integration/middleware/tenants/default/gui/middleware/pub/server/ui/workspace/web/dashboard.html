	<style>
		.preload .pre-content{left: 80px;}

			display: block !important;
		}
		.modal-header {
			display: inline-block;
		}

		.modal-body li.nav-link.active.in {

			border: none;

			display: none;
		}

		body {
			background: #f7f9fc;
		}

		main.loader-shell {
			min-height: calc(100vh - 72px);
			display: flex !important;
			align-items: center;
			justify-content: center;
			padding: 24px;
		}

		.loader-card {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-width: 280px;
			padding: 34px 30px;
			border: 1px solid #e7ecf4;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 12px 34px rgba(4, 13, 33, 0.08);
			text-align: center;
		}

		.loader-icon {
			position: relative;
			width: 54px;
			height: 54px;
			margin-bottom: 18px;
		}

		.loader-icon::before,
		.loader-icon::after {
			content: "";
			position: absolute;
			inset: 0;
			border-radius: 50%;
			border: 4px solid transparent;
		}

		.loader-icon::before {
			border-top-color: #2c61f5;
			border-right-color: #2c61f5;
			animation: loader-spin 0.8s linear infinite;
		}

		.loader-icon::after {
			inset: 10px;
			border-top-color: #44b678;
			border-left-color: #44b678;
			animation: loader-spin 1.1s linear infinite reverse;
		}

		.loader-text {
			margin: 0;
			color: #434550;
			font-size: 16px;
			font-weight: 500;
			line-height: 1.4;
		}

		.loader-dots {
			display: flex;
			gap: 6px;
			margin-top: 12px;
		}

		.loader-dots span {
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: #8996a4;
			animation: loader-pulse 1s ease-in-out infinite;
		}

		.loader-dots span:nth-child(2) {
			animation-delay: 0.15s;
		}

		.loader-dots span:nth-child(3) {
			animation-delay: 0.3s;
		}

		@keyframes loader-spin {
			to {
				transform: rotate(360deg);
			}
		}

		@keyframes loader-pulse {
			0%, 100% {
				opacity: 0.35;
				transform: translateY(0);
			}

			50% {
				opacity: 1;
				transform: translateY(-4px);
			}
		}

	</style>
