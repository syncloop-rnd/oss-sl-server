	<script>
		function getTenant(){
			var pathName=window.location.pathname;
			var pathTokens = pathName.split("/");
			if(pathTokens[0]=="tenant")
				return pathTokens[1];
			return "default";
		}

		let authPopup = null;
		let popupCheckInterval = null;

		function openWorkspace(authServer) {
			if (continueExistingSession()) {
				return;
			}

			let url = window.env.API_BASE_URL + '/tenant/default/' + authServer + '/login';

			softLogout();

			authPopup = window.open(
				url,
				"popupWindow",
				"width=800,height=600,left=200,top=100"
			);

			// Show overlay
			document.getElementById("popupOverlay").classList.add("active");

			// Watch for popup close
			popupCheckInterval = setInterval(() => {
				if (!authPopup || authPopup.closed) {
					clearInterval(popupCheckInterval);
					closeOverlay();
				}
			}, 500);
		}

		function relaunchPopup() {
			if (!authPopup || authPopup.closed) {
				openWorkspace('google');
			} else {
				authPopup.focus();
			}
		}

		function closeOverlay() {
			document.getElementById("popupOverlay").classList.remove("active");
		}

		window.addEventListener("message", function (event) {
			if (event.origin !== window.window.env.API_BASE_URL) return;

			console.log("Received from child:", event.data);

			if (event.data.action === "installLoggingKeys") {
				installLoggingKeys(event.data.payload);
			}

		});

	</script>

<script type="text/javascript">

            this.classList.toggle("bi-eye");
        });

    </script>

	<script>
		const dashboardUrl = "/middleware/pub/server/ui/workspace/web/dashboard.html";

		function openTenantSelection() {
			const redirectUrl = new URLSearchParams(window.location.search).get("r");
			location.href = "/middleware/pub/server/ui/tenant/selectTenant.html" +
				(redirectUrl ? "?r=" + encodeURIComponent(redirectUrl) : "");
		}

		function continueExistingSession() {
			if (!localStorage.getItem("AuthToken")) return false;
			const redirectUrl = new URLSearchParams(window.location.search).get("r");
			location.href = localStorage.getItem("tenant") ? (redirectUrl || dashboardUrl) :
				"/middleware/pub/server/ui/tenant/selectTenant.html" +
				(redirectUrl ? "?r=" + encodeURIComponent(redirectUrl) : "");
			return true;
		}

		window.addEventListener("storage", function (event) {
			if ((event.key === "AuthToken" || event.key === "tenant") && event.newValue) {
				continueExistingSession();
			}
		});

		function tryLogin(ref) {
			$(ref).addClass("disabled");
			$(ref).html("Logging...");
			$.ajax({
				url: window.ENV.API_BASE_URL + "/jwt/basic",
				method: "GET",
				headers: {
					"Authorization": "Basic " + btoa($("#username").val() + ":" + $("#password").val())
				},
				success: function(result) {
					$(ref).removeClass("disabled");
					$(ref).text("Log In");

					const resp = JSON.parse(result);

					localStorage.removeItem("tenant");
					localStorage.setItem("AuthToken", resp.token);
					var tenantName = resp.tenant;
					localStorage.setItem("loginTenant", !tenantName ? "default" : tenantName);
					localStorage.setItem("loginUserId", $("#username").val());

					openTenantSelection();

				},
				error: function(err) {
					$(ref).removeClass("disabled");
					$(ref).text("Log In");
					$.toast('<div class="custom-toast"><span class="tst red"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"><defs><style>.cls-1 {fill: #fff;fill-rule: evenodd;}</style></defs><g id="notification_error"><path class="cls-in" d="M275.5,28A12.5,12.5,0,1,1,288,15.5,12.514,12.514,0,0,1,275.5,28Zm0-24A11.5,11.5,0,1,0,287,15.5,11.513,11.513,0,0,0,275.5,4Zm-0.473,13.867-2.241,2.241a1.339,1.339,0,0,1-1.894-1.894l2.241-2.241a0.669,0.669,0,0,0,0-.947l-2.241-2.241a1.339,1.339,0,0,1,1.894-1.894l2.241,2.241a0.67,0.67,0,0,0,.947,0l2.24-2.241a1.339,1.339,0,0,1,1.894,1.894l-2.241,2.241a0.671,0.671,0,0,0,0,.947l2.241,2.241a1.339,1.339,0,0,1-1.894,1.894l-2.24-2.241a0.67,0.67,0,0,0-.947,0h0Z" transform="translate(-260)"/></g></svg></span><div class="t_info"><h5>Oops!</h5><span>Enter the correct username and password to log in</span></div></div>');
				}
			});
		}
		document.addEventListener("keydown", function (event) {
			if (event.key === "Enter") {
				const active = document.activeElement;

				if (active && (active.id === "username" || active.id === "password")) {
					event.preventDefault();

					const loginBtn = document.querySelector(".btn.btn-gry");
					if (loginBtn && !loginBtn.classList.contains("disabled")) {
						tryLogin(loginBtn);
					}
				}
			}
		});

		function installLoggingKeys(payload) {

			debugger;
			if (payload.is_new_tenant) {
				localStorage.setItem("welcome_agent_setup_pending", true);
				localStorage.setItem("welcome_agent_setup_init", true);
			}

			localStorage.removeItem("tenant");
			localStorage.setItem("AuthToken", payload.token);
			localStorage.setItem("loginTenant", !payload.tenant ? "default" : payload.tenant);
			localStorage.setItem("loginUserId", payload.userId || payload.userID || payload.email || "");
			openTenantSelection();
		}

		continueExistingSession();

	</script>
