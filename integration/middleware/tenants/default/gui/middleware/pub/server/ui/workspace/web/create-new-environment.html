			<script type="text/javascript">
				$(document).ready(function () {

					$("#environment_name").focusout(function () {
						$("#alias_domain_name").val(getTenant() + "-" + $("#environment_name").val());
					});

					$("#hosted_domain_name").change(function () {
						$("#master_domain_name").html($("#hosted_domain_name option:selected").text());
					});
					$("#domain_registrar").change(function () {
						let value = $(this).val().split("-");
						if (value[1] == "godaddy") {
							asyncRestRequest("/packages.middleware.pub.environments.api.getHostedDomainGoDaddy.main?credential_id=" + value[0], null,  "GET", function (response) {
								response = response.response;
								$("#hosted_domain_name").html("");
								for (let i = 0 ; i < response.length ; i++) {
									$("#hosted_domain_name").append("<option>" + response[i].domain + "</option>");
								}
								$("#master_domain_name").html($("#hosted_domain_name option:selected").text());
							});
						} else if (value[1] == "route53") {
							asyncRestRequest("/packages.middleware.pub.environments.api.getHostedDomainRoute53.main?credential_id=" + value[0], null,  "GET", function (response) {
								response = response.response;
								$("#hosted_domain_name").html("");
								for (let i = 0 ; i < response.HostedZones.length ; i++) {
									$("#hosted_domain_name").append("<option value='" + response.HostedZones[i].Id + "'>" + response.HostedZones[i].Name.substring(0 , response.HostedZones[i].Name.length - 1) + "</option>");
								}
								$("#master_domain_name").html($("#hosted_domain_name option:selected").text());
							});
						}

					})
				});
				function getAllCredentials() {
					asyncRestRequest("/packages.middleware.pub.environments.api.getCredentials.main?length=100&start=0", null,  "GET", function (response) {
						$("#credential_id").html("");
						$("#credential_id2").html("");
						$("#domain_registrar").html("<option value='-1'>Do not setup an alias</option>");
						for (var i = 0 ; i < response.credentials.length ; i++) {
							$("#credential_id").append("<option value='" + response.credentials[i].id + "'>" + response.credentials[i].name + ":" + response.credentials[i].api_username + "</option>");
							$("#credential_id2").append("<option value='" + response.credentials[i].id + "'>" + response.credentials[i].name + ":" + response.credentials[i].api_username + "</option>");
							$("#domain_registrar").append("<option value='" + response.credentials[i].id + "-" + response.credentials[i].name +  "'>" + response.credentials[i].name + "</option>");
						}
					});
				}

				getAllCredentials();

				function loadCertificates(ref) {
					$(ref).html("...");
					asyncRestRequest("/packages.Wrapper.AWS.acm.getCertificates.main", JSON.stringify({
						"credential_id": $("#credential_id").val(),
						"region": $("#environment_aws_region").val()
					}),  "POST", function (response) {


						$("#environment_aws_acm_arn").html("");

						if (null == response.response.CertificateSummaryList) {
							swal({
									title: "Error.",
									text: JSON.stringify(response.response),
									type: "error",
									confirmButtonColor: "#f2533e"
								});

						} else {
							if (response.response.CertificateSummaryList.length == 0) {
								swal({
										title: "Error.",
										text: "No certificate found in this region.",
										type: "error",
										confirmButtonColor: "#f2533e"
									});

							}
							for (var i = 0; i < response.response.CertificateSummaryList.length; i++) {
								$("#environment_aws_acm_arn").append("<option value='" + response.response.CertificateSummaryList[i].CertificateArn + "'>" + response.response.CertificateSummaryList[i].SubjectAlternativeNameSummaries[0] + "</option>")
							}
						}
						$(ref).html("Load");
					});
				}

				function deployContainer(ref, deployStatus) {
					if ($("#environment_name").val().trim() == "") {
							swal({
								title: "Environment Name",
								text: "Field is mandatory",
								type: "error",
								confirmButtonColor: "#f2533e"
							});


						return;
						}

					if (null == $("#environment_aws_acm_arn").val()) {
						swal({
								title: "Certificate",
								text: "Please select a certificate.",
								type: "error",
								confirmButtonColor: "#f2533e"
							});

						return ;
					}

					if ($("#aws_vpc_id").val().trim() == "") {
						swal({
								title: "VPC ID",
								text: "Field is mandatory",
								type: "error",
								confirmButtonColor: "#f2533e"
							});

						return ;
					}

					if ($("#aws_vpc_id").val().trim() == "") {
						swal({
								title: "VPC ID",
								text: "Field is mandatory",
								type: "error",
								confirmButtonColor: "#f2533e"
							});

						return ;
					}

					if ($("#domain_registrar").val().trim() != -1 && $("#hosted_domain_name").val() == null) {
						swal({
								title: "Alias name",
								text: "Please select an alias name.",
								type: "error",
								confirmButtonColor: "#f2533e"
							});

						return ;
					}

					if (parseInt($("#auto_scaling_min_nodes").val()) > parseInt($("#auto_scaling_max_nodes").val()) ) {
						swal({
								title: "Invalid Node",
								text: "Min node should be less than or equal max node.",
								type: "error",
								confirmButtonColor: "#f2533e"
							});

						return ;
					}

					var request = {
						"name": $("#environment_name").val(),
						"type": "AWS_ECS",
						"credential_id": $("#credential_id").val(),
						"data_center_region": $("#environment_aws_region").val(),
						"port_mapping": "",
						"protocol": "",
						"aws_acm_arn": $("#environment_aws_acm_arn").val(),
						"auto_scaling_min_nodes": $("#auto_scaling_min_nodes").val(),
						"auto_scaling_max_nodes": $("#auto_scaling_max_nodes").val(),
						"auto_scaling_cpu_threshold": $("#auto_scaling_cpu_threshold").val(),
						"deploy": deployStatus,
						"vpcId": $("#aws_vpc_id").val(),
						"subnets": [],
						"resource_cups": $("#resource_cups_memory").val().split("-")[0],
						"resource_memory": $("#resource_cups_memory").val().split("-")[1],
						"sub_domain": $("#alias_domain_name").val() + "." + $("#hosted_domain_name option:selected").text(),
						"domain_registrar": $("#domain_registrar").val().split("-")[1],
						"domain_registrar_zone_id": $("#hosted_domain_name").val(),
						"dns_mapping": "false",
						"tenant": "default"
					};

					if ($("#aws_vpc_subnet_id_1").val().trim() != "") {
						request.subnets.push($("#aws_vpc_subnet_id_1").val());
					}
					if ($("#aws_vpc_subnet_id_2").val().trim() != "") {
						request.subnets.push($("#aws_vpc_subnet_id_2").val());
					}
					if ($("#aws_vpc_subnet_id_3").val().trim() != "") {
						request.subnets.push($("#aws_vpc_subnet_id_3").val());
					}
					if ($("#aws_vpc_subnet_id_4").val().trim() != "") {
						request.subnets.push($("#aws_vpc_subnet_id_4").val());
					}

					if (request.subnets.length == 0) {

						swal({
								title: "Subnets",
								text: "Subnets are required",
								type: "error",
								confirmButtonColor: "#f2533e"
							});

						return ;
					}


					$(".deploy-container").attr('disabled', 'disabled');

					asyncRestRequest("/packages.middleware.pub.environments.api.deployContainer.main", JSON.stringify(request),  "POST", function (response) {
						if (response.status == true && response.cf_response.Error != null) {
							swal({
									title: "Error Occurred. Please try again.",
									text: JSON.stringify(response.cf_response.Error),
									type: "error",
									confirmButtonColor: "#f2533e"
								});

						} else if (response.status == true) {
							location.href = "middleware/pub/server/ui/workspace/web/setting.html?tab=deployments&created=true";
						} else {
							swal({
								title: "Error Occurred. Please try again.",
								text: "",
								type: "error",
								confirmButtonColor: "#f2533e"
							});

						}
						$(".deploy-container").removeAttr('disabled');
					});

				}

				function getTenant(){
					const tenant = localStorage.getItem("tenant");
					if (tenant && typeof tenant === "string" && tenant.trim() !== "" &&
							tenant !== "null" && tenant !== "undefined") {
						return tenant.trim();
					}
					return "default";
				}
