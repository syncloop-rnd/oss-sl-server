<head>

    <link href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,600" rel="stylesheet">

    <script type="text/javascript">
        var SDK_EMBEDDED = false;
    </script>
	<script>
	function getTenant(){
		var pathName=window.location.pathname;
		var pathTokens = pathName.split("/");
		if(pathTokens[0]=="tenant")
			return pathTokens[1];
		return "default";
	}
	function openWorkspace(authServer){
		window.open('/tenant/'+getTenant()+'/'+authServer+'/login','Workspace','height=720,width=1280,left=100,top=100,location=0,directories=0,resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,directories=no, status=no');
	}
	</script>
</head>
<body class="is-boxed has-animations">
    <div class="body-wrap">


        <main>
            <section class="hero">
                <div class="container">
                    <div class="hero-inner">
						<div class="hero-copy">
	                        <h1 class="hero-title mt-0">Get Jwt Token</h1>
	                        <p class="hero-paragraph">Use this token as API key to access EKA APIs.</p>
	                        <div class="hero-cta" id="jwt-token" style="width: 600px;word-break: break-all;"></div>
                    </div>
                </div>
            </section>




        </main>


    </div>

    <script src="dist/js/main.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
$.get("/jwt", function(data, status){
$("#jwt-token").html(data);
});
</script>
