<html style="min-height: 100% !important;">
<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<base href="/"><script src="env.js"></script>
	<script>
		window.ENV = window.env || {};
	</script>
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="middleware/pub/server/ui/assets/img/favicon.ico" type="image/x-icon" />
	<!-- Bootstrap CSS -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="middleware/pub/server/ui/assets/css/bootstrap.min.css">
	<!-- Style -->
	<link rel="stylesheet" href="middleware/pub/server/ui/assets/css/login.css">
	<link rel="stylesheet" href="middleware/pub/server/ui/assets/css/intlTelInput.css">
	<link rel="stylesheet" href="middleware/pub/server/ui/assets/css/select2.min.css">
	<link rel="stylesheet" href="middleware/pub/server/ui/assets/css/dashboard.css">
	<title>Syncloop | About Yourself</title>
	<script type="syncloop/analytics"></script>
</head>
<body>
<script type="syncloop/body-analytics"></script>
<div id="toasts"></div>
<div class="d-lg-flex half">
	<div class="bg order-1 order-md-2 tell_us_img"></div>
	<div class="contents order-2 order-md-1">
		<div class="container login-style">
			<div class="login_logo"><img src="middleware/pub/server/ui/assets/img/syncloop-blue-logo.svg" alt="Image"></div>
			<div class="row align-items-center justify-content-center reset_ps">
				<div class="col-md-9">
					<h3>Tell us about yourself</h3>
					<p>Add your details below</p>
					<form>
						<div class="form-group first spr yrsf">
							<input type="text" placeholder="Your name" class="form-control icon1" id="username" />
						</div>
						<div class="form-group first spr yrsf">
							<select class="form-control option_s1" id="job_role">
								<option></option>
								<option>Project Manager</option>
								<option>Developer</option>
							</select>
						</div>
						<div class="form-group first spr yrsf">
							<input type="text" id="mobile_code" class="form-control" placeholder="Phone Number (optional)" name="name">
						</div>
						<div class="d-flex mb-4 align-items-center mtt-2">
							<label class="enble_check">By continuing, you're agreeing to our <a target="_blank" href="https://www.syncloop.com/terms-conditions.html?utm_source=Workspace&utm_medium=about-yourself-page&utm_id=Terms+and+Conditions">Terms and Conditions</a></label>
						</div>
						<button onclick="doUpdate(this)" type="button" id="" class="btn btn-gry">Continue</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.13/js/intlTelInput-jquery.min.js"></script>
<script src="middleware/pub/server/ui/assets/js/select2.full.min.js"></script>
<script src="middleware/pub/server/ui/assets/js/select2-init.js"></script>
<script src="middleware/pub/server/ui/assets/js/custom-dashboard.js"></script>
<script type="text/javascript" src="middleware/pub/server/ui/javascript/middleware.js"></script>
<script>
	// -----Country Code Selection
	$("#mobile_code").intlTelInput({
		initialCountry: "in",
		separateDialCode: true,
		// utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/11.0.4/js/utils.js"
	});
	function doUpdate(ref) {
		const name = $("#username").val().trim();
		const jobRole = $("#job_role").val().trim();
		const phone = $("#mobile_code").val().trim();

		if (!name) {
			$.toast('<div class="custom-toast"><span class="tst red"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"><defs><style>.cls-1 {fill: #fff;fill-rule: evenodd;}</style></defs><g id="notification_error"><path class="cls-in" d="M275.5,28A12.5,12.5,0,1,1,288,15.5,12.514,12.514,0,0,1,275.5,28Zm0-24A11.5,11.5,0,1,0,287,15.5,11.513,11.513,0,0,0,275.5,4Zm-0.473,13.867-2.241,2.241a1.339,1.339,0,0,1-1.894-1.894l2.241-2.241a0.669,0.669,0,0,0,0-.947l-2.241-2.241a1.339,1.339,0,0,1,1.894-1.894l2.241,2.241a0.67,0.67,0,0,0,.947,0l2.24-2.241a1.339,1.339,0,0,1,1.894,1.894l-2.241,2.241a0.671,0.671,0,0,0,0,.947l2.241,2.241a1.339,1.339,0,0,1-1.894,1.894l-2.24-2.241a0.67,0.67,0,0,0-.947,0h0Z" transform="translate(-260)"/></g></svg></span><div class="t_info"><h5>Oops!</h5><span>' + "Name is required." + '</span></div></div>');
			return;
		}

		if (!jobRole) {
			$.toast('<div class="custom-toast"><span class="tst red"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"><defs><style>.cls-1 {fill: #fff;fill-rule: evenodd;}</style></defs><g id="notification_error"><path class="cls-in" d="M275.5,28A12.5,12.5,0,1,1,288,15.5,12.514,12.514,0,0,1,275.5,28Zm0-24A11.5,11.5,0,1,0,287,15.5,11.513,11.513,0,0,0,275.5,4Zm-0.473,13.867-2.241,2.241a1.339,1.339,0,0,1-1.894-1.894l2.241-2.241a0.669,0.669,0,0,0,0-.947l-2.241-2.241a1.339,1.339,0,0,1,1.894-1.894l2.241,2.241a0.67,0.67,0,0,0,.947,0l2.24-2.241a1.339,1.339,0,0,1,1.894,1.894l-2.241,2.241a0.671,0.671,0,0,0,0,.947l2.241,2.241a1.339,1.339,0,0,1-1.894,1.894l-2.24-2.241a0.67,0.67,0,0,0-.947,0h0Z" transform="translate(-260)"/></g></svg></span><div class="t_info"><h5>Oops!</h5><span>' + "Job Role is required." + '</span></div></div>');
			return;
		}

		$(ref).attr("disabled", "disabled").html("...");

		$.ajax({
			type: "POST",
			url: window.ENV.API_BASE_URL + "/public/packages.onboarding.api.updateOnboarded.main",
			data: JSON.stringify({
				"email": getQueryVariable('email'),
				"secret": getQueryVariable('secret'),
				"name": name,
				"phone": phone ? $(".iti__selected-dial-code").text().replace("+", "") + phone : "",
				"job": jobRole
			}),
			contentType: "application/json",
			success: function (response) {
				$(ref).removeAttr("disabled");
				$(ref).html("Continue");
				if (response.status == true) {
					setTimeout(function () {
						location.href = "/";
					}, 2000);
				} else {
					$.toast('<div class="custom-toast"><span class="tst red"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"><defs><style>.cls-1 {fill: #fff;fill-rule: evenodd;}</style></defs><g id="notification_error"><path class="cls-in" d="M275.5,28A12.5,12.5,0,1,1,288,15.5,12.514,12.514,0,0,1,275.5,28Zm0-24A11.5,11.5,0,1,0,287,15.5,11.513,11.513,0,0,0,275.5,4Zm-0.473,13.867-2.241,2.241a1.339,1.339,0,0,1-1.894-1.894l2.241-2.241a0.669,0.669,0,0,0,0-.947l-2.241-2.241a1.339,1.339,0,0,1,1.894-1.894l2.241,2.241a0.67,0.67,0,0,0,.947,0l2.24-2.241a1.339,1.339,0,0,1,1.894,1.894l-2.241,2.241a0.671,0.671,0,0,0,0,.947l2.241,2.241a1.339,1.339,0,0,1-1.894,1.894l-2.24-2.241a0.67,0.67,0,0,0-.947,0h0Z" transform="translate(-260)"/></g></svg></span><div class="t_info"><h5>Oops!</h5><span>Unable to verify your secret.</span></div></div>');
				}
			}
		});
	}
</script>
</body>
</html>
