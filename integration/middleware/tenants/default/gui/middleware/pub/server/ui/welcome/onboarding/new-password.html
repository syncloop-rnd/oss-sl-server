<html style="min-height: 100% !important;">
<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<base href="/"><script src="env.js"></script>
	<script>
		window.ENV = window.env || {};
	</script>
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="middleware/pub/server/ui/assets/img/favicon.ico" type="image/x-icon" />
	<!-- Bootstrap CSS -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="middleware/pub/server/ui/assets/css/bootstrap.min.css" />
	<!-- Style -->
	<link rel="stylesheet" href="middleware/pub/server/ui/assets/css/login.css" />
	<link rel="stylesheet" href="middleware/pub/server/ui/assets/css/dashboard.css" />
	<link rel="stylesheet" href="middleware/pub/server/ui/assets/img/icon_apple.png" />
	<title>Syncloop | New Password</title>
	<script type="syncloop/analytics"></script>
</head>
<body>
<script type="syncloop/body-analytics"></script>
<div id="toasts"></div>
<div class="d-lg-flex half">
	<div class="bg order-1 order-md-2 reset_img"></div>
	<div class="contents order-2 order-md-1">
		<div class="container login-style">
			<div class="login_logo"><img src="middleware/pub/server/ui/assets/img/syncloop-blue-logo.svg" alt="Image"></div>
			<div class="row align-items-center justify-content-center reset_ps">
				<div class="col-md-9">
					<h3>Change password?</h3>
					<p>Your password must be at least six characters, cannot contain spaces, and cannot match your email address.</p>
					<form>
						<div class="form-group first spr">
							<input id="password" type="password" placeholder="New password" class="form-control" name="password" />
							<i class="us-p" aria-hidden="true"><img src="middleware/pub/server/ui/assets/img/icon_lock.svg"></i>
							<i class="bi bi-eye-slash" id="togglePassword"></i>
						</div>
						<div class="form-group last spr">
							<input id="confirm_password" type="password" placeholder="Confirm password" class="form-control" name="password" />
							<i class="us-p" aria-hidden="true"><img src="middleware/pub/server/ui/assets/img/icon_lock.svg"></i>
						</div>
						<button type="button" id="reset_password" class="btn btn-gry">Set Password</button>
					</form>
					<div class="back_login">Back to <a href="middleware/pub/server/ui/welcome/onboarding/login.html?utm_source=Workspace&utm_medium=reset-password&utm_id=back-to-login">Login</a></div>
				</div>
			</div>
		</div>
	</div>
</div>

</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
<script src="middleware/pub/server/ui/assets/js/custom-dashboard.js"></script>
<script type="text/javascript">
	$(document).ready(function () {
		$("#reset_password").click(function () {
			const button = $(this);
			button.attr("disabled", true).addClass("disabled");

			const password = $("#password").val().trim();
			const confirmPassword = $("#confirm_password").val().trim();
			const email = getQueryVariable('email'); // Get the email from the URL

			// Password Empty Check
			if (!password) {
				$.toast('<div class="custom-toast"><span class="tst red"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"><defs><style>.cls-1 {fill: #fff;fill-rule: evenodd;}</style></defs><g id="notification_error"><path class="cls-in" d="M275.5,28A12.5,12.5,0,1,1,288,15.5,12.514,12.514,0,0,1,275.5,28Zm0-24A11.5,11.5,0,1,0,287,15.5,11.513,11.513,0,0,0,275.5,4Zm-0.473,13.867-2.241,2.241a1.339,1.339,0,0,1-1.894-1.894l2.241-2.241a0.669,0.669,0,0,0,0-.947l-2.241-2.241a1.339,1.339,0,0,1,1.894-1.894l2.241,2.241a0.67,0.67,0,0,0,.947,0l2.24-2.241a1.339,1.339,0,0,1,1.894,1.894l-2.241,2.241a0.671,0.671,0,0,0,0,.947l2.241,2.241a1.339,1.339,0,0,1-1.894,1.894l-2.24-2.241a0.67,0.67,0,0,0-.947,0h0Z" transform="translate(-260)"/></g></svg></span><div class="t_info"><h5>Oops!</h5><span>Password is required.</span></div></div>');
				button.removeAttr("disabled").removeClass("disabled");
				return;
			}

			// Confirm Password Empty Check
			if (!confirmPassword) {
				$.toast('<div class="custom-toast"><span class="tst red"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"><defs><style>.cls-1 {fill: #fff;fill-rule: evenodd;}</style></defs><g id="notification_error"><path class="cls-in" d="M275.5,28A12.5,12.5,0,1,1,288,15.5,12.514,12.514,0,0,1,275.5,28Zm0-24A11.5,11.5,0,1,0,287,15.5,11.513,11.513,0,0,0,275.5,4Zm-0.473,13.867-2.241,2.241a1.339,1.339,0,0,1-1.894-1.894l2.241-2.241a0.669,0.669,0,0,0,0-.947l-2.241-2.241a1.339,1.339,0,0,1,1.894-1.894l2.241,2.241a0.67,0.67,0,0,0,.947,0l2.24-2.241a1.339,1.339,0,0,1,1.894,1.894l-2.241,2.241a0.671,0.671,0,0,0,0,.947l2.241,2.241a1.339,1.339,0,0,1-1.894,1.894l-2.24-2.241a0.67,0.67,0,0,0-.947,0h0Z" transform="translate(-260)"/></g></svg></span><div class="t_info"><h5>Oops!</h5><span>Confirm password is required.</span></div></div>');
				button.removeAttr("disabled").removeClass("disabled");
				return;
			}

			// Password Match Check
			if (password !== confirmPassword) {
				$.toast('<div class="custom-toast"><span class="tst red"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"><defs><style>.cls-1 {fill: #fff;fill-rule: evenodd;}</style></defs><g id="notification_error"><path class="cls-in" d="M275.5,28A12.5,12.5,0,1,1,288,15.5,12.514,12.514,0,0,1,275.5,28Zm0-24A11.5,11.5,0,1,0,287,15.5,11.513,11.513,0,0,0,275.5,4Zm-0.473,13.867-2.241,2.241a1.339,1.339,0,0,1-1.894-1.894l2.241-2.241a0.669,0.669,0,0,0,0-.947l-2.241-2.241a1.339,1.339,0,0,1,1.894-1.894l2.241,2.241a0.67,0.67,0,0,0,.947,0l2.24-2.241a1.339,1.339,0,0,1,1.894,1.894l-2.241,2.241a0.671,0.671,0,0,0,0,.947l2.241,2.241a1.339,1.339,0,0,1-1.894,1.894l-2.24-2.241a0.67,0.67,0,0,0-.947,0h0Z" transform="translate(-260)"/></g></svg></span><div class="t_info"><h5>Oops!</h5><span>Passwords do not match. Please try again.</span></div></div>');
				button.removeAttr("disabled").removeClass("disabled");
				return;
			}

			if (password.length < 6 || password.length > 18 || /\s/.test(password)) {
				$.toast('<div class="custom-toast"><span class="tst red"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"><defs><style>.cls-1 {fill: #fff;fill-rule: evenodd;}</style></defs><g id="notification_error"><path class="cls-in" d="M275.5,28A12.5,12.5,0,1,1,288,15.5,12.514,12.514,0,0,1,275.5,28Zm0-24A11.5,11.5,0,1,0,287,15.5,11.513,11.513,0,0,0,275.5,4Zm-0.473,13.867-2.241,2.241a1.339,1.339,0,0,1-1.894-1.894l2.241-2.241a0.669,0.669,0,0,0,0-.947l-2.241-2.241a1.339,1.339,0,0,1,1.894-1.894l2.241,2.241a0.67,0.67,0,0,0,.947,0l2.24-2.241a1.339,1.339,0,0,1,1.894,1.894l-2.241,2.241a0.671,0.671,0,0,0,0,.947l2.241,2.241a1.339,1.339,0,0,1-1.894,1.894l-2.24-2.241a0.67,0.67,0,0,0-.947,0h0Z" transform="translate(-260)"/></g></svg></span><div class="t_info"><h5>Oops!</h5><span>Password must be between 6 and 18 characters, without spaces and cannot match your email address.</span></div></div>');
				button.removeAttr("disabled").removeClass("disabled");
				return;
			}

			$.ajax({
				url: window.ENV.API_BASE_URL + "/public/reset_password",
				method: "POST",
				data: JSON.stringify({
					"email": email,
					"password": password,
					"secret": getQueryVariable('secret')
				}),
				contentType: "application/json",
				success: function (response) {
					if (response.status) {
						$.toast('<div class="custom-toast"><span class="tst green"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"><defs><style>.cls-1 {fill: #fff;fill-rule: evenodd;}</style></defs><g id="notification_success"><path class="cls-in" d="M405.5,28A12.5,12.5,0,1,1,418,15.5,12.514,12.514,0,0,1,405.5,28Zm0-24A11.5,11.5,0,1,0,417,15.5,11.513,11.513,0,0,0,405.5,4Zm6.171,8.578-7.056,7a1.086,1.086,0,0,1-1.522.028l-3.736-3.4a1.122,1.122,0,0,1-.083-1.55,1.1,1.1,0,0,1,1.55-.055l2.96,2.712L410.094,11A1.115,1.115,0,0,1,411.671,12.578Z" transform="translate(-390)"/></g></svg></span><div class="t_info"><h5>Success</h5><span>Password updated successfully.</span></div></div>');
						setTimeout(function () {
							location.href = "/";
						}, 2000);
					} else {
						$.toast('<div class="custom-toast"><span class="tst red"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"><defs><style>.cls-1 {fill: #fff;fill-rule: evenodd;}</style></defs><g id="notification_error"><path class="cls-in" d="M275.5,28A12.5,12.5,0,1,1,288,15.5,12.514,12.514,0,0,1,275.5,28Zm0-24A11.5,11.5,0,1,0,287,15.5,11.513,11.513,0,0,0,275.5,4Zm-0.473,13.867-2.241,2.241a1.339,1.339,0,0,1-1.894-1.894l2.241-2.241a0.669,0.669,0,0,0,0-.947l-2.241-2.241a1.339,1.339,0,0,1,1.894-1.894l2.241,2.241a0.67,0.67,0,0,0,.947,0l2.24-2.241a1.339,1.339,0,0,1,1.894,1.894l-2.241,2.241a0.671,0.671,0,0,0,0,.947l2.241,2.241a1.339,1.339,0,0,1-1.894,1.894l-2.24-2.241a0.67,0.67,0,0,0-.947,0h0Z" transform="translate(-260)"/></g></svg></span><div class="t_info"><h5>Oops!</h5><span>Error in updating the password. Please try later</span></div></div>');
						button.removeAttr("disabled").removeClass("disabled");
					}

					$("#send_password_link").removeClass("disabled");
				},
				error: function (e){
					$("#reset_password").removeClass("disabled");
				}
			});
		});
	});

	function getQueryVariable(variable) {
		var query = window.location.search.substring(1);
		var vars = query.split("&");
		for (var i = 0; i < vars.length; i++) {
			var pair = vars[i].split("=");
			if (pair[0] == variable) {
				return pair[1];
			}
		}
		return "#";
	}

	const togglePassword = document.querySelector("#togglePassword");
        const password = document.querySelector("#password");

        togglePassword.addEventListener("click", function () {
            // toggle the type attribute
            const type = password.getAttribute("type") === "password" ? "text" : "password";
            password.setAttribute("type", type);

            // toggle the icon
            this.classList.toggle("bi-eye");
        });
</script>
</html>
