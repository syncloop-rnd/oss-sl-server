<!DOCTYPE html>
<html>
<head>

<title>CodeMirror: JavaScript mode</title>
  <base href="/"><script src="env.js"></script>
  <script>
    window.ENV = window.env || {};
  </script>
<meta charset="utf-8"/>
<link rel=stylesheet href="middleware/pub/server/ui/workspace/web/CodeMirror-master/doc/docs.css">

<link rel="stylesheet" href="middleware/pub/server/ui/workspace/web/CodeMirror-master/lib/codemirror.css">
<script src="middleware/pub/server/ui/workspace/web/CodeMirror-master/lib/codemirror.js"></script>
<script src="middleware/pub/server/ui/workspace/web/CodeMirror-master/addon/edit/matchbrackets.js"></script>
<script src="middleware/pub/server/ui/workspace/web/CodeMirror-master/addon/comment/continuecomment.js"></script>
<script src="middleware/pub/server/ui/workspace/web/CodeMirror-master/addon/comment/comment.js"></script>
<script src="javascript.js"></script>
<script	src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="middleware/pub/server/ui/javascript/middleware.js"></script>
<link rel="stylesheet" href="middleware/pub/server/ui/css/middleware.css">
  <script type="syncloop/analytics"></script>
<style>.CodeMirror {height:96%;width:100%}</style>
</head>
<body style="width:100%;height:100%;">

<div class="navbar">
   <div class="dropdown">
    <button class="dropbtn">JavaScript
      <i class="fa fa-caret-down"></i>
    </button>
    <div class="dropdown-content">
      <a href="#" onclick="save();">Save</a>
      <a href="#" onclick="location.reload();">Reload</a>
    </div>
  </div>
</div>
<div style="width:100%;height:100%;overflow:hidden;"><textarea id="code" name="code">

</textarea></div>

    <script>
	loadFile=getUrlParam("loadFile");
	var response=syncRestRequest("/"+loadFile, "GET", "");
	if(response.status==200){
	response=response.payload;
	$("#code").val(response);
	}else{
		alert(response.payload);
	}
      var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
        lineNumbers: true,
        matchBrackets: true,
        continueComments: "Enter",
        extraKeys: {"Ctrl-Q": "toggleComment"}
      });

	  function save(){
		data=editor.getValue();
		var response=syncRestRequest("/"+loadFile, "POST", data,"application/text","application/text");
		if(response.status==200){
			//localStorage.setItem(loadFile, "");
			alert("Saved");
		}else
		alert(JSON.parse(response.payload).error);
	}
  </script></body></html>
