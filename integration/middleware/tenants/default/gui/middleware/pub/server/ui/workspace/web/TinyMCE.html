<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--<script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.2.0/tinymce.min.js" referrerpolicy="origin"></script>-->
    <script src="https://cdn.ckeditor.com/ckeditor5/35.3.0/decoupled-document/ckeditor.js"></script>
    <script	src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="middleware/pub/server/ui/javascript/middleware.js"></script>
    <link rel="stylesheet"	href="middleware/pub/server/ui/bootstrap-3.4.1-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="middleware/pub/server/ui/css/workspace.css" />
    <style>
        .mg-15 {margin: 10px;border: solid 1px #ccc;width: 98%; padding:10px; height: 100%;}
        .ck-editor__editable {min-height:390px;height: 390px;overflow-y: scroll !important;}
        @media screen and (min-width: 1200px) and (max-device-width: 1400px) {
            .ck-editor__editable {height:54rem;}
        }
        @media screen and (min-width: 1441px) and (max-device-width: 1920px) {
            .ck-editor__editable {height:68em;}
        }
        @media screen and (min-width: 1921px) and (max-device-width: 2560px) {
            .ck-editor__editable {height:160rem;}
        }
        .container-2 {
            position: absolute;
            background: rgb(0,0,0,0.5);
            width: 100%;
            height: 100%;
            display: none;
        }
        .lds-ripple {
            display: block;
            position: relative;
            width: 80px;
            height: 80px;
            margin: 20% auto;
        }
        .lds-ripple div {
            position: absolute;
            border: 4px solid #fff;
            opacity: 1;
            border-radius: 50%;
            animation: lds-ripple 1s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }
        .lds-ripple div:nth-child(2) {
            animation-delay: -0.5s;
        }
        @keyframes lds-ripple {
            0% {
                top: 36px;
                left: 36px;
                width: 0;
                height: 0;
                opacity: 0;
            }
            4.9% {
                top: 36px;
                left: 36px;
                width: 0;
                height: 0;
                opacity: 0;
            }
            5% {
                top: 36px;
                left: 36px;
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                top: 0px;
                left: 0px;
                width: 72px;
                height: 72px;
                opacity: 0;
            }
        }
    </style>
    <script>
        var loadFile=getUrlParam("loadFile");
        var serviceName=loadFile.substring(loadFile.lastIndexOf('/')+1);
        function loadService(){
            location.href="middleware/pub/server/ui/workspace/web/flowMaker/flowEditor.html?loadFile="+loadFile;
        }

        function init(){
            $('.container-2').fadeIn(1500);
            $("#ServiceName").html(serviceName);
            var response=syncRestRequest("/"+(loadFile+"#xyz").replace(".flow#xyz",".html"), "GET", "");
            //console.log(response.status);
            if(response.status==200){
                response=response.payload;
                $("#default-editor").html(response);
            }else
                $("#default-editor").html("Write your API documentation here");
            /*	tinymce.init({
                selector: '#default-editor',
                height : "505",
                plugins: [
                  'a11ychecker','advlist','advcode','advtable','autolink','checklist','export',
                  'lists','link','image','charmap','preview','anchor','searchreplace','visualblocks',
                  'powerpaste','fullscreen','formatpainter','insertdatetime','media','table','help','wordcount'
                ],
                toolbar: 'undo redo | formatpainter casechange blocks | bold italic backcolor | ' +
                  'alignleft aligncenter alignright alignjustify | ' +
                  'bullist numlist checklist outdent indent | removeformat | a11ycheck code table help'
            });
            */
            //var screen_height=$( window ).height();
            //alert(screen_height);
            var decoupledEditor=DecoupledEditor
                .create( document.querySelector('#default-editor' ));
            decoupledEditor.then( editor => {
                const toolbarContainer = document.querySelector( '#toolbar-container' );
                toolbarContainer.appendChild( editor.ui.view.toolbar.element );
            } )
                .catch( error => {
                    console.error( error );
                } );
            //alert(decoupledEditor);
            $('.container-2').fadeOut(1500);
            const btn = document.getElementById('saveDetails');
            //decoupledEditor.
            btn.addEventListener('click', () => {
                const editorContent = decoupledEditor.getContent();
                var response=syncRestRequest("/"+(loadFile+"#xyz").replace(".flow#xyz",".html"), "POST", editorContent,"application/text","application/text");
                if(response.status==200){
                    //localStorage.setItem(loadFile, "");
                    alert("Saved");
                }else
                    alert(JSON.parse(response.payload).error);
            });
        }

    </script>
</head>
<!-- <div class="container">
   <div class="row">  <div class="lds-ripple"><div></div><div></div></div></div>

     </div>
   -->
<body onload='init()'>
<div class="container-2">
    <div class="lds-ripple">
        <div></div>
        <div></div>
    </div>
</div>
<div class="mg-15">
    <h4 id='ServiceName' onclick='loadService()' style="cursor:pointer;"></h4>
    <form method="post">
        <!-- <textarea id="default-editor"><p></p></textarea>-->
        <div id="toolbar-container"></div>
        <!-- This container will become the editable. -->
        <div id="default-editor" >
            <p>This is the initial editor content.</p>
        </div>
    </form>
</div>
<button id="saveDetails" class="btn btn-primary">Save</button>
<button class="btn btn-primary" onclick="history.back()">Back</button>
<script></script>
</body>
</html>
