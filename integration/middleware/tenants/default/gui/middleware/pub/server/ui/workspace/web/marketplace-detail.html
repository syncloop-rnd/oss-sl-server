    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var urlParams = new URLSearchParams(window.location.search);
            var selectedPluginSlug = urlParams.get('plugin');
            var buttonType = urlParams.get('buttonType');
            const tenant = localStorage.getItem("tenant") || "default";
            const accessToken = localStorage.getItem("AuthToken");

            const url =
                window.ENV.API_BASE_URL +
                "/tenant/" + tenant +
                "/packages.middleware.pub.platform.getSelectedPluginDetail.main" +
                "?uuid=" + encodeURIComponent(selectedPluginSlug) +
                "&access_token=" + encodeURIComponent(accessToken);

            if (selectedPluginSlug) {
                fetch(url)
                    .then(response => response.json())
                    .then(function (data) {
                        if (data && data.marketplace) {
                            updateModalWithData(data.marketplace, buttonType);
                        } else {
                            console.error("Selected plugin not found in the API response.");
                        }
                    })
                    .catch(function (error) {
                        console.error("There was a problem with the API request:", error);
                    });
            } else {
                console.error("No selected plugin slug in the URL.");
            }
        });

        function updateModalWithData(data, buttonType) {
            document.querySelector('.mkp-title').textContent = data.name;
            const ownerWebsite = data.owner && data.owner.website ? data.owner.website : 'https://www.syncloop.com/';
            document.querySelector('.mkp-title').href = ownerWebsite;
            document.querySelector('.tag-list span').textContent = data.latest_version;
            document.querySelector('a[href="#"]').href = data.website;
            if (null == data.service) {
                $(".mkp-image-wrap").html(data.name.slice(0, 1));
            } else {
                $(".mkp-image-wrap").html('<img src="https://repo.syncloop.com/logo/logo_' + data.service + '.svg" />');
            }

            document.getElementById('overview-tab-pane').innerHTML = '<p>' + data.description + '</p>';

            var metricsTabPane = document.getElementById('metrics-tab-pane');
            metricsTabPane.innerHTML = '<table class="table">' +
                '<thead>' +
                '<tr>' +
                '<th scope="col">#</th>' +
                '<th scope="col">First</th>' +
                '<th scope="col">Last</th>' +
                '<th scope="col">Handle</th>' +
                '</tr>' +
                '</thead>' +
                '<tbody>';

            if (data.metrics) {
                data.metrics.forEach(function (metric) {
                    metricsTabPane.innerHTML += '<tr>' +
                        '<th scope="row">' + metric.id + '</th>' +
                        '<td>' + metric.first + '</td>' +
                        '<td>' + metric.last + '</td>' +
                        '<td>' + metric.handle + '</td>' +
                        '</tr>';
                });
            }

            let screenshorts = [];

            if (data && data.screenshorts !== null && data.screenshorts !== undefined) {
                if (Array.isArray(data.screenshorts)) {
                    screenshorts = data.screenshorts;
                } else if (typeof data.screenshorts === 'string') {
                    const trimmedScreenshot = data.screenshorts.trim();
                    if (trimmedScreenshot.includes(',')) {
                        screenshorts = trimmedScreenshot.split(',');
                    } else if (trimmedScreenshot) {
                        screenshorts.push(trimmedScreenshot);
                    }
                } else {
                    screenshorts.push(data.screenshorts);
                }
            }


            let HTML = '';
            let HTML_2 = '';


            for (let i = 0; i < screenshorts.length; i++) {
                HTML += '<div class="item"><a class="image-popup-vertical-fit" href="' + screenshorts[i].trim() + '" title=""><img src="' + screenshorts[i].trim() + '" width="100%" height="300px"></a></div>';
                HTML_2 += '<div class="item"><img src="' + screenshorts[i].trim() + '" width="80" height="50"></div>';
            }

            if (screenshorts.length === 0) {
                $("#screenshots-tab").hide();
            }

            $("#sync1").html(HTML);
            $("#sync2").html(HTML_2);

            metricsTabPane.innerHTML += '</tbody></table>';

            document.getElementById('license-tab-pane').innerHTML = '<p>' + data.license.description + '</p>';

            var lastUpdatedDate = new Date(data.modified_on);
            var formattedDate = lastUpdatedDate.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.querySelector('.text-gray').textContent = 'Last Updated on ' + formattedDate;

            if (!data.installed) {
                $(".installButton").show();
                $(".updateButton, .uninstallButton").hide();

                let ref = this;

                $(".installButton").click(function () {
                    var pluginId = data.unique_id;
                    var version = data.latest_version;

                    swal({
                            title: "Do you want to install this plugin?",
                            text: "",
                            type: "info",
                            showCancelButton: true,
                            confirmButtonColor: "#2C61F5",
                            cancelButtonText: "No, cancel it !!",
                            confirmButtonText: "Yes, install it !!",
                            showLoaderOnConfirm: true,
                            closeOnConfirm: false,
                            closeOnCancel: true
                        },
                        function (isConfirm) {
                            if (isConfirm) {
                                const token = crypto.randomUUID();
                                $(ref).html("Installing...").addClass("disabled");
                                performAction(data, pluginId, version, 'install', token, ref);
                                return;
                            }
                        });
                });
            } else if (data.requiredUpdate) {
                $(".updateButton").show();
                $(".installButton, .uninstallButton").hide();

                $(".updateButton").click(function () {
                    var pluginId = data.unique_id;
                    var version = data.latest_version;
                    const token = crypto.randomUUID();
                    $(this).html("Updating...").addClass("disabled");
                    performAction(data, pluginId, version, 'update', token, this);
                    return;
                });
            } else if (data.installed) {
                $(".uninstallButton").show();
                $(".installButton, .updateButton").hide();

                $(".uninstallButton").click(function () {
                    var pluginId = data.unique_id;
                    let ref = this;

                    swal({
                            title: "Do you want to uninstall this plugin?",
                            text: "",
                            type: "info",
                            showCancelButton: true,
                            confirmButtonColor: "#f2533e",
                            cancelButtonText: "No, cancel it !!",
                            confirmButtonText: "Yes, uninstall it !!",
                            showLoaderOnConfirm: true,
                            closeOnConfirm: false,
                            closeOnCancel: true
                        },
                        function (isConfirm) {
                            if (isConfirm) {
                                const token = crypto.randomUUID();
                                $(ref).html("Uninstalling...").addClass("disabled");
                                performAction(data, pluginId, null, 'uninstall', token, ref);
                                return;
                            }
                        });
                });
            }


            var sync1 = $("#sync1");
            var sync2 = $("#sync2");
            var slidesPerPage = 6; //globaly define number of elements per page
            var syncedSecondary = true;

            sync1.owlCarousel({
                items : 1,
                slideSpeed : 2000,
                nav: true,
                //autoplay: true,
                dots: false,
                loop: true,
                responsiveRefreshRate : 200,
                navText: ['<svg width="100%" height="100%" viewBox="0 0 11 20"><path style="fill:none;stroke-width: 1px;stroke: #FFF;" d="M9.554,1.001l-8.607,8.607l8.607,8.606"/></svg>','<svg width="100%" height="100%" viewBox="0 0 11 20" version="1.1"><path style="fill:none;stroke-width: 1px;stroke: #FFF;" d="M1.054,18.214l8.606,-8.606l-8.606,-8.607"/></svg>'],
            }).on('changed.owl.carousel', syncPosition);

            sync2
                .on('initialized.owl.carousel', function () {
                    sync2.find(".owl-item").eq(0).addClass("current");
                })
                .owlCarousel({
                    items : slidesPerPage,
                    dots: false,
                    nav: false,
                    smartSpeed: 200,
                    slideSpeed : 500,
                    slideBy: slidesPerPage, //alternatively you can slide by 1, this way the active slide will stick to the first item in the second carousel
                    responsiveRefreshRate : 100
                }).on('changed.owl.carousel', syncPosition2);

            function syncPosition(el) {
                //if you set loop to false, you have to restore this next line
                //var current = el.item.index;

                //if you disable loop you have to comment this block
                var count = el.item.count-1;
                var current = Math.round(el.item.index - (el.item.count/2) - .5);

                if(current < 0) {
                    current = count;
                }
                if(current > count) {
                    current = 0;
                }

                //end block

                sync2
                    .find(".owl-item")
                    .removeClass("current")
                    .eq(current)
                    .addClass("current");
                var onscreen = sync2.find('.owl-item.active').length - 1;
                var start = sync2.find('.owl-item.active').first().index();
                var end = sync2.find('.owl-item.active').last().index();

                if (current > end) {
                    sync2.data('owl.carousel').to(current, 100, true);
                }
                if (current < start) {
                    sync2.data('owl.carousel').to(current - onscreen, 100, true);
                }
            }

            function syncPosition2(el) {
                if(syncedSecondary) {
                    var number = el.item.index;
                    sync1.data('owl.carousel').to(number, 100, true);
                }
            }

            sync2.on("click", ".owl-item", function(e){
                e.preventDefault();
                var number = $(this).index();
                sync1.data('owl.carousel').to(number, 300, true);
            });

            $('.image-popup-vertical-fit').magnificPopup({
                type: 'image',
                closeOnContentClick: true,
                mainClass: 'mfp-img-mobile',
                image: {
                    verticalFit: true
                }

            });

            $('.image-popup-fit-width').magnificPopup({
                type: 'image',
                closeOnContentClick: true,
                image: {
                    verticalFit: false
                }
            });

            $('.image-popup-no-margins').magnificPopup({
                type: 'image',
                closeOnContentClick: true,
                closeBtnInside: false,
                fixedContentPos: true,
                mainClass: 'mfp-no-margins mfp-with-zoom', // class to remove default margin from left and right side
                image: {
                    verticalFit: true
                },
                zoom: {
                    enabled: true,
                    duration: 300 // don't foget to change the duration also in CSS
                }
            });
        }

        function performAction(data, pluginId, version, action, token, ref) {
            var apiUrl = window.ENV.API_BASE_URL + "/tenant/" + localStorage.getItem("tenant") + "/packages.middleware.pub.platform.installAPlugin.main";
            var queryParams = `?pluginId=${encodeURIComponent(pluginId)}&version=${encodeURIComponent(version)}&token=${encodeURIComponent(token)}`;

            if (action === 'uninstall') {
                apiUrl = window.ENV.API_BASE_URL + "/tenant/" + localStorage.getItem("tenant") + "/packages.middleware.pub.platform.deleteAPlugin.main";
                const slugname = data.installing_path;
                queryParams = `?unique_id=${encodeURIComponent(pluginId)}&token=${encodeURIComponent(token)}&location=${slugname}.package`;
            }

            function stopPolling(poller) {
                if (poller) clearInterval(poller);
            }

            function startPolling(pollingToken, pollerRef) {
                const tenant = localStorage.getItem("tenant") || "default";
                const accessToken = localStorage.getItem("AuthToken");

                pollerRef = setInterval(() => {
                    const url =
                        window.ENV.API_BASE_URL +
                        "/tenant/" + tenant +
                        "/packages.middleware.pub.platform.checkPollingPluginStatus.main" +
                        "?token=" + encodeURIComponent(pollingToken) +
                        "&access_token=" + encodeURIComponent(accessToken);

                    fetch(url)
                        .then(res => res.json())
                        .then(data => {
                            if (data.response.status === "COMPLETED_SUCCESS") {
                                stopPolling(pollerRef);
                                showSuccessPopup(action, ref);
                            } else if (data.response.status === "COMPLETED_ERROR") {
                                stopPolling(pollerRef);
                                showErrorPopup(action, ref);
                            }
                        })
                        .catch(() => {
                            stopPolling(pollerRef);
                            showErrorPopup(action, ref);
                        });
                }, 5000);
            }

            function showSuccessPopup(action, ref) {
                setTimeout(() => {
                    const msg = action === 'uninstall' ? "Plugin uninstalled successfully" : "Plugin installed successfully";
                    swal({
                            title: "Success",
                            text: msg,
                            type: "success",
                            confirmButtonColor: "#2C61F5" // red confirm button
                        });

                    $(ref).html(capitalizeFirstLetter(action)).removeClass("disabled");
                    updateButtonType(action);
                }, 500);
            }

            function showErrorPopup(action, ref) {
                setTimeout(() => {
                    const msg = action === 'uninstall' ? "Error uninstalling plugin" : "Error installing plugin";
                    swal({
                            title: "Error",
                            text: msg,
                            type: "error",
                            confirmButtonColor: "#f2533e"
                        });

                    $(ref).html(capitalizeFirstLetter(action)).removeClass("disabled");
                }, 800);
            }

            function capitalizeFirstLetter(text) {
                return text.charAt(0).toUpperCase() + text.slice(1);
            }

            $.ajax({
                type: action === 'uninstall' ? 'DELETE' : 'POST',
                url: apiUrl + queryParams,
                headers: {
                    "Authorization": `Bearer ${localStorage.getItem("AuthToken")}`,
                    'Content-Type': 'application/json',
                },
                success: function (response) {
                },
                error: function () {
                }
            });
            if (token) {
                startPolling(token);
            }
        }

        function updateButtonType(action) {
            var newButtonType = getUpdatedButtonType(action);
            var currentUrl = window.location.href;
            var updatedUrl = updateQueryStringParameter(currentUrl, 'buttonType', newButtonType);
            window.location.href = updatedUrl;
        }

        function getUpdatedButtonType(action) {
            var currentButtonType = getCurrentButtonType();

            if (action === 'install') {
                return 'open';
            } else if (action === 'update') {
                return 'open';
            } else if (action === 'uninstall') {
                return 'install';
            }

            return currentButtonType;
        }

        function getCurrentButtonType() {
            var urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('buttonType') || 'install';
        }

        function updateQueryStringParameter(uri, key, value) {
            var re = new RegExp("([?&])" + key + "=.*?(&|$)", "i");
            var separator = uri.indexOf('?') !== -1 ? "&" : "?";
            if (uri.match(re)) {
                return uri.replace(re, '$1' + key + "=" + value + '$2');
            }
            else {
                return uri + separator + key + "=" + value;
            }
        }


    </script>

</body>
</html>
