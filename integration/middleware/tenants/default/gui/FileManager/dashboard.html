<!DOCTYPE html>
<html lang="en" ng-app="fileManagerApp">
<head>
    <meta charset="UTF-8">
    <title>File Manager</title>
    <base href="/"><script src="env.js"></script>
    <script>
        window.ENV = window.env || {};
    </script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
:root {
  /* Define global design tokens */
  --color-background: #ffffff;
  --color-text: #212529;
  --color-card-bg: #f8f9fa;
  --color-highlight-bg: #e9ecef;
  --color-primary: #007bff;
  --font-family-base: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
  --spacing-unit: 8px; /* Base spacing unit */
}

.dark-mode {
  --color-background: #343a40;
  --color-text: #f8f9fa;
  --color-card-bg: #495057;
  --color-highlight-bg: #6c757d;
  --color-primary: #58a6ff;
}

body {
  background-color: var(--color-background);
  color: var(--color-text);
  font-family: var(--font-family-base);
  line-height: 1.6; /* Improved line height for readability */
  transition: background-color 0.3s ease, color 0.3s ease; /* Specific transitions */
}

.centered-container {
  max-width: 960px; /* Slightly increased max-width for more breathing room */
  margin: 0 auto;
  padding: calc(var(--spacing-unit) * 2); /* Using spacing unit */
}

.card {
  background-color: var(--color-card-bg);
  border-radius: 0.5rem; /* Subtle rounded corners */
  box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); /* Soft shadow for depth */
  margin-bottom: calc(var(--spacing-unit) * 2.5);
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
  overflow: hidden; /* Ensures rounded corners clip content */
}

.file-item {
  padding: calc(var(--spacing-unit) * 1.5) calc(var(--spacing-unit) * 2);
  border-bottom: 1px solid var(--color-highlight-bg); /* Using highlight color for border */
  transition: background-color 0.2s ease;
  display: flex; /* Using flex for better alignment */
  align-items: center;
  justify-content: space-between; /* Example for potential future additions */
}

.file-item:last-child {
  border-bottom: none; /* Remove border from the last item */
}

.file-item:hover {
  background-color: var(--color-highlight-bg);
  cursor: pointer; /* Indicate interactivity */
}

.dark-mode .file-item {
  border-bottom-color: #555; /* Dark mode border */
}

.loading,
.progress-upload { /* Combined styling for loading/progress */
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 1000; /* Ensure it's above other content */
}

.progress-upload {
  display: none; /* Keep this display none until needed */
  width: 100%;
  max-width: 300px; /* Example max-width */
  text-align: center;
}

.theme-toggle {
  position: absolute;
  top: calc(var(--spacing-unit) * 1.5);
  right: calc(var(--spacing-unit) * 1.5);
  cursor: pointer;
}

.fade-in {
  animation: fadeIn 0.5s ease-in forwards; /* `forwards` keeps the final state */
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); } /* Slight upward movement for a softer fade */
  to { opacity: 1; transform: translateY(0); }
}

/* Example of more specific transitions */
.card:hover {
  box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15); /* More pronounced shadow on hover */
}
    </style>
</head>
<body ng-controller="FileManagerCtrl">
    <div class="container-fluid p-3 centered-container">
        <!-- Theme Toggle -->
        <button class="btn btn-secondary theme-toggle" ng-click="toggleTheme()">
            <i class="fas" ng-class="darkMode ? 'fa-sun' : 'fa-moon'"></i>
        </button>

        <!-- File List (Centered) -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>
                    Location {{currentPath}}
                    <i class="fas fa-copy ml-2 text-secondary" style="cursor:pointer"
                       ng-click="copyPath()" title="Copy path to clipboard"></i>
                </span>
                <div>
                    <button class="btn btn-primary mr-2" ng-click="showCreateFolderModal()">
                        <i class="fas fa-folder-plus"></i> New Folder
                    </button>
                    <button class="btn btn-primary mr-2" ng-click="zipCurrent()">
                        <i class="fas fa-file-archive"></i> Zip Folder
                    </button>
                    <button class="btn btn-primary" ng-click="triggerUpload()">
                        <i class="fas fa-upload"></i> Upload
                    </button>
                    <input type="file" id="fileInput"
                           accept=".pdf,.doc,.txt,.csv,.xml,.jpg,.jpeg,.png,.gif,.xls,.xlsx"
                           style="display: none;">
                </div>
            </div>
            <div class="card-body">
                <!-- Breadcrumb -->
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb" ng-if="breadcrumbs.length">
                        <li class="breadcrumb-item" ng-repeat="crumb in breadcrumbs" ng-class="{active: $last}">
                            <a href="#" ng-if="!$last" ng-click="navigateTo(crumb.path)">{{crumb.name}}</a>
                            <span ng-if="$last">{{crumb.name}}</span>
                        </li>
                    </ol>
                </nav>
                <!-- File List -->
                <div class="file-item fade-in"
                     ng-repeat="item in fileList">
					 <span title="{{item.name}}" ng-click="item.isFolder && navigateTo(item.path)">
                    <i class="fas" ng-class="getIconClass(item.name)"></i>
						<span ng-if="item.name.length <= 80">
							{{item.name}}
						</span>
						<span ng-if="item.name.length > 80">
							{{item.name.substring(0, 80) + '***'}}
						</span>
					</span>
                    <span class="float-right">
						<i ng-if="item.isFolder" class="fas fa-copy ml-2 text-secondary" style="cursor:pointer"
                       ng-click="copyPath(item.name)" title="Copy path to clipboard"></i>
                        <!-- Zip this item -->
                        <i class="fas fa-file-archive mr-2 text-info"
                           style="cursor:pointer"
                           ng-click="zipItem(item.path, $event)"
                           title="Zip {{item.name}}"></i>
                        <!-- Download -->
                        <a href="/files/uploads{{item.path}}"
                           class="text-success mr-2" target="_blank">
                            <i class="fas fa-download"></i>
                        </a>
                        <!-- Delete -->
                        <i class="fas fa-trash text-danger"
                           style="cursor:pointer"
                           ng-click="confirmDelete(item.path, $event)"></i>
                    </span>
                </div>

                <div ng-if="!fileList.length" class="text-center">No files or folders found.</div>
                <!-- Upload Progress -->
                <div class="progress progress-upload" ng-show="uploading">
                    <div class="progress-bar" role="progressbar"
                         style="width: {{uploadProgress}}%;"
                         aria-valuenow="{{uploadProgress}}"
                         aria-valuemin="0" aria-valuemax="100">
                        {{uploadProgress | number:0}}%
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Folder Modal -->
    <div class="modal fade" id="createFolderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="background-color: var(--card-bg); color: var(--text-color);">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Folder</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="folderName">Folder Name</label>
                        <input type="text" class="form-control" id="folderName"
                               ng-model="newFolderName"
                               placeholder="Enter folder name (lowercase, no special characters)">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" ng-click="createFolder()">Create</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmationModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="background-color: var(--card-bg); color: var(--text-color);">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmation</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-cancel" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary btn-confirm">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div class="modal fade" id="alertModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content" style="background-color: var(--card-bg); color: var(--text-color);">
                <div class="modal-header">
                    <h5 class="modal-title">Alert</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div class="loading" ng-show="loading || uploading">
        <i class="fas fa-spinner fa-spin fa-3x"></i>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/angular@1.8.2/angular.min.js"></script>
    <script>
    angular.module('fileManagerApp', [])
      .controller('FileManagerCtrl', function($scope, $http) {
        $scope.currentPath = '/';
        $scope.fileList = [];
        $scope.breadcrumbs = [];
        $scope.loading = false;
        $scope.uploading = false;
        $scope.uploadProgress = 0;
        $scope.darkMode = localStorage.getItem('darkMode') === 'true';
        $scope.newFolderName = '';

        if ($scope.darkMode) $('body').addClass('dark-mode');

        const getTenant = () => localStorage.getItem('tenant') || 'default';
        const getAuthToken = () => localStorage.getItem('AuthToken') || '';
        const getAuthHeaders = () => {
          const token = getAuthToken();
          return token ? { Authorization: 'Bearer ' + token } : {};
        };
        const buildApiUrl = service =>
          window.ENV.API_BASE_URL + "/tenant/" + getTenant() + "/" + service;
        const buildHttpConfig = params => ({
          headers: getAuthHeaders(),
          params: params || {}
        });

        // -- load, navigate, breadcrumbs, icons, createFolder, upload, delete methods (unchanged) --

        $scope.loadFolderContents = function(path) {
          $scope.loading = true;
          $http.get(
            buildApiUrl('packages.FileManager.dashboard.services.api.listFiles.main'),
            buildHttpConfig({ path: path })
          )
          .then(resp => {

			if(!resp.data.list)
				resp.data.list=[];
            $scope.fileList = resp.data.list.map(item => ({
              name: item,
              path: path + (path === '/' ? '' : '/') + item,
              isFolder: !item.includes('.')
            }));
            $scope.currentPath = path;
            $scope.updateBreadcrumbs();
          })
          .catch(err => $scope.showAlert('Error loading: ' + err.data?.error || err.statusText))
          .finally(() => $scope.loading = false);
        };

        $scope.loadFolderContents('/');

        $scope.navigateTo = function(path) {
          $scope.loadFolderContents(path);
        };

        $scope.updateBreadcrumbs = function() {
          const parts = $scope.currentPath.split('/').filter(p => p);
          $scope.breadcrumbs = [{ name: 'Home', path: '/' }]
            .concat(parts.map((p,i) => ({
              name: p,
              path: '/' + parts.slice(0,i+1).join('/')
            })));
        };

        $scope.getIconClass = function(name) {
          if (!name.includes('.')) return 'fa-folder';
          const ext = name.split('.').pop().toLowerCase();
          return {
            pdf: 'fa-file-pdf',
            doc: 'fa-file-word',
            txt: 'fa-file-alt',
            csv: 'fa-file-csv',
            xml: 'fa-file-code',
            jpg: 'fa-file-image',
            jpeg: 'fa-file-image',
            png: 'fa-file-image',
            gif: 'fa-file-image',
            xls: 'fa-file-excel',
            xlsx: 'fa-file-excel'
          }[ext] || 'fa-file';
        };

        $scope.showCreateFolderModal = () => $('#createFolderModal').modal('show');
        $scope.createFolder = function() {
          const name = $scope.newFolderName.trim();
          const invalid = /[\/\\:*?"<>|]/;
          if (!name) return $scope.showAlert('Folder name required.');
          if (name !== name.toLowerCase()) return $scope.showAlert('Must be lowercase.');
          if (invalid.test(name)) return $scope.showAlert('Invalid characters.');
          if ($scope.fileList.some(i=>i.name===name)) return $scope.showAlert('Already exists.');
          $scope.fileList.push({ name, path: $scope.currentPath + ( $scope.currentPath==='/'?'':'/') + name, isFolder:true });
          $('#createFolderModal').modal('hide');
        };

        $scope.triggerUpload = () => $('#fileInput').click();
        $scope.uploadFile = file => {
          $scope.uploading = true;
          $scope.uploadProgress = 0;
          const fd = new FormData();
          fd.append('file', file);
          fd.append('path', $scope.currentPath);
          const xhr = new XMLHttpRequest();
          xhr.upload.onprogress = e => {
            if (e.lengthComputable) {
              $scope.$apply(() => $scope.uploadProgress = (e.loaded/e.total)*100);
            }
          };
          xhr.open('POST', buildApiUrl('packages.FileManager.dashboard.services.api.UploadFile.main') + '?folderPath=' + encodeURIComponent($scope.currentPath));
          const authToken = getAuthToken();
          if (authToken) {
            xhr.setRequestHeader('Authorization', 'Bearer ' + authToken);
          }
          xhr.onload = () => {
            $scope.uploading = false;
            const r = JSON.parse(xhr.responseText);
            if (r.status==='success') $scope.loadFolderContents($scope.currentPath);
            else $scope.showAlert('Upload failed: ' + r.error);
            $scope.$apply();
          };
          xhr.onerror = () => {
            $scope.uploading = false;
            $scope.showAlert('Upload error');
            $scope.$apply();
          };
          xhr.send(fd);
        };
        $('#fileInput').on('change', function() {
          if (this.files[0]) $scope.uploadFile(this.files[0]);
          this.value = '';
        });

        $scope.confirmDelete = function(path, e) {
          e.stopPropagation();
          $scope.showConfirmation('Delete ' + path.split('/').pop() + '?', () => {
            $scope.loading = true;
            $http.delete(
              buildApiUrl('packages.FileManager.dashboard.services.api.deleteFile.main'),
              buildHttpConfig({ path: path })
            )
              .then(r => {
                if (r.data.status==='success') $scope.loadFolderContents($scope.currentPath);
                else $scope.showAlert('Delete failed: '+r.data.error);
              })
              .catch(err => $scope.showAlert('Error deleting: '+err.data?.error || err.statusText))
              .finally(() => $scope.loading = false);
          });
        };

        $scope.showConfirmation = (msg, cb) => {
          $('#confirmationModal .modal-body').text(msg);
          $('#confirmationModal').modal('show');
          $('#confirmationModal .btn-confirm').off('click').on('click', () => {
            $('#confirmationModal').modal('hide');
            cb();
          });
        };
        $scope.showAlert = msg => {
          $('#alertModal .modal-body').text(msg);
          $('#alertModal').modal('show');
        };

        $scope.toggleTheme = () => {
          $scope.darkMode = !$scope.darkMode;
          $('body').toggleClass('dark-mode', $scope.darkMode);
          localStorage.setItem('darkMode', $scope.darkMode);
        };

        // ——— New: copy and zip ———

        $scope.copyPath = function(name) {
          if (!navigator.clipboard) {
            $scope.showAlert('Clipboard API not supported');
            return;
          }
          navigator.clipboard.writeText("/uploads"+$scope.currentPath+"/"+name)
            //.then(() => $scope.showAlert('Path copied to clipboard'))
            .catch(() => $scope.showAlert('Failed to copy path'));
        };

        $scope.zipCurrent = function() {
          $scope.loading = true;
          $http.get(
            buildApiUrl('packages.FileManager.dashboard.services.api.createZip.main'),
            buildHttpConfig({ path: $scope.currentPath })
          ).then(resp => {
            if (resp.data.status === 'success') {
              $scope.loadFolderContents($scope.currentPath);
            } else {
              $scope.showAlert('Zip failed: ' + resp.data.error);
            }
          }).catch(err => {
            $scope.showAlert('Error zipping folder: ' + (err.data?.error || err.statusText));
          }).finally(() => $scope.loading = false);
        };

        $scope.zipItem = function(path, $event) {
          $event.stopPropagation();
          $scope.loading = true;
          $http.get(
            buildApiUrl('packages.FileManager.dashboard.services.api.createZip.main'),
            buildHttpConfig({ path: path })
          ).then(resp => {
            if (resp.data.status === 'success') {
              $scope.loadFolderContents($scope.currentPath);
            } else {
              $scope.showAlert('Zip failed: ' + resp.data.error);
            }
          }).catch(err => {
            $scope.showAlert('Error zipping item: ' + (err.data?.error || err.statusText));
          }).finally(() => $scope.loading = false);
        };

      });
    </script>
</body>
</html>
