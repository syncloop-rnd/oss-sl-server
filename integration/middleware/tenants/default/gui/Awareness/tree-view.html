<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tree</title>
    <base href="/"><script src="env.js"></script>
    <script>
        window.ENV = window.env || {};
    </script>
    <link href="Awareness/pub/assets/index-BH8Ri0zx.css" rel="stylesheet" />
    <style>

        .skeleton-image {
            width: 100%;
            margin-bottom: 20px;
            height: 500px;
            background: #e0e0e0;
            border-radius: 8px;
            animation: shimmer 1.5s infinite linear;
        }

        .skeleton-text {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 4px;
            animation: shimmer 1.5s infinite linear;
        }

        .skeleton-text.short {
            width: 60%;
        }


        @keyframes shimmer {
            0% {
                background-position: 100%;
            }
            100% {
                background-position: -100%;
            }
        }

        .skeleton-image,
        .skeleton-text {
            background: linear-gradient(
                    90deg,
                    #e0e0e0 25%,
                    #f5f5f5 50%,
                    #e0e0e0 75%
            );
            background-size: 200% 100%;
        }
    </style>
</head>
<body onload="loadData()">
<script type="syncloop/body-analytics"></script>
    <div id="root">
        <div class="col-lg-4">
            <div class="skeleton-wrapper">
                <div class="skeleton-image"></div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        var template = {};
    </script>
    <script>
        function loadData() {
            const tenant = localStorage.getItem("tenant") || "default";
            const accessToken = localStorage.getItem("AuthToken");
            const params = new URLSearchParams(window.location.search);
            const appId = params.get("appId");

            const apiUrl =
                window.ENV.API_BASE_URL +
                "/tenant/" + tenant +
                "/packages.syncloopai.dashboard.services.api.apps.tree.App.main" +
                "?appId=" + encodeURIComponent(appId) +
                "&access_token=" + encodeURIComponent(accessToken);

            const script = document.createElement('script');
            script.src = 'Awareness/pub/assets/index-BZtyZ8Xs.js';
            script.type = 'text/javascript';

            const xhr = new XMLHttpRequest();
            xhr.open("GET", apiUrl, true);

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    template = JSON.parse(xhr.responseText);
                    document.head.appendChild(script);
                }
            };
            xhr.send();
        }
  </script>

</body>
</html>
