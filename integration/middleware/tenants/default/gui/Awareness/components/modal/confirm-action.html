<div ng-show="confirmOverlay.visible"
     style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.42); z-index: 1050;"
     ng-click="confirmOverlayNo()"></div>

<div ng-show="confirmOverlay.visible"
     style="position: fixed; inset: 0; z-index: 1051; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="modal-content text-center"
         style="width: min(440px, calc(100vw - 32px)); border: 0; border-radius: 18px; padding: 26px 28px 22px; box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18); position: relative;"
         ng-click="$event.stopPropagation()">

        <button type="button"
                aria-label="Close"
                ng-click="confirmOverlayNo()"
                style="position: absolute; top: 12px; right: 14px; border: 0; background: transparent; color: #98a2b3; font-size: 24px; line-height: 1; width: 28px; height: 28px;">
            &times;
        </button>

        <img src="Awareness/pub/images/delete_exclamation.svg"
             width="68"
             alt="Confirm"
             style="margin: 0 auto 10px; display: block;">

        <h2 class="modal_title"
            style="margin: 8px 0 0; font-size: 22px; line-height: 1.25;">
            {{confirmOverlay.title}}
        </h2>

        <p class="modal_desc"
           style="margin: 10px auto 0; max-width: 320px; padding: 0; text-align: center; color: #5b6472; font-weight: 400; line-height: 1.55;">
            {{confirmOverlay.text}}
        </p>

        <div style="display: flex; justify-content: center; gap: 12px; margin-top: 24px;">
            <button type="button"
                    class="modal_btncancel"
                    ng-click="confirmOverlayNo()"
                    style="min-width: 118px; padding: 12px 18px; margin: 0; background: #eef1f5; color: #111827;">
                {{confirmOverlay.cancelText}}
            </button>

            <button type="button"
                    class="modal_btnfailed"
                    ng-click="confirmOverlayYes()"
                    style="min-width: 118px; padding: 12px 18px; margin: 0; background: #f2533e;">
                {{confirmOverlay.confirmText}}
            </button>
        </div>
    </div>
</div>
