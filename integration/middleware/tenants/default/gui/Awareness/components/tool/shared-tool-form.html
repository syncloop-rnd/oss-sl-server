<!-- components/tool/shared-tool-form.html -->
<form name="toolFormNg"
      novalidate
      ng-submit="createToolFromModal(toolFormNg)">

    <!-- Tool Selection -->
    <div class="form-group row">
        <label class="col-sm-4 entire_toggletitle">
            Tool
            <a href="javascript:void(0)" class="info_tooltip">
                <img ng-src="Awareness/pub/images/info.svg">
                <span class="tooltiptext">Select tool from Tools</span>
            </a>
        </label>
        <div class="col-sm-8 position-rel">
            <select class="input_form"
                    id="registryToolSelect"
                    name="registryTool"
                    ng-model="toolForm.registryUUID"
                    ng-options="t.UUID as (t.NAME + ' (' + t.FQN + ')') for t in spec.ToolsRegistry"
                    required
                    ng-class="{'input_formerror': (toolFormNg.registryTool.$touched || toolFormNg.$submitted) && toolFormNg.registryTool.$invalid}">
                <option value="">Select tool</option>
            </select>
            <div class="form_error select_error"
                 ng-if="(toolFormNg.registryTool.$touched || toolFormNg.$submitted) && toolFormNg.registryTool.$error.required">
            </div>
        </div>
    </div>

    <!-- Description -->
    <div class="form-group row">
        <label class="col-sm-4 entire_toggletitle align-self-start pt-2">
            Description
            <a href="javascript:void(0)" class="info_tooltip">
                <img ng-src="Awareness/pub/images/info.svg">
                <span class="tooltiptext">Describe how this tool should be used</span>
            </a>
        </label>
        <div class="col-sm-8 position-rel">
            <textarea class="textarea_form"
                      name="description"
                      ng-model="toolForm.description"
                      required
                      rows="4"
                      placeholder="Tool description"
                      ng-class="{'input_formerror': (toolFormNg.description.$touched || toolFormNg.$submitted) && toolFormNg.description.$invalid}"></textarea>
            <div class="help-block form_error input_error"
                 ng-if="(toolFormNg.description.$touched || toolFormNg.$submitted) && toolFormNg.description.$error.required">
            </div>
        </div>
    </div>

    <!-- Static Payload (Generated from Schema) -->
    <div class="form-group row"
         ng-if="!toolForm.hideStaticPayloadEditor"
         id="toolVariablesRow"
         style="display:none">
        <label class="col-sm-4 entire_toggletitle align-self-start pt-2">
            Static Payload
            <a href="javascript:void(0)" class="info_tooltip">
                <img ng-src="Awareness/pub/images/info.svg">
                <span class="tooltiptext">Provide static values for schema parameters</span>
            </a>
        </label>
        <div class="col-sm-8">
            <label style="display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid #e7e7ef; border-radius:10px; background:#fafbff; margin-bottom:12px; cursor:pointer;">
                <input type="checkbox"
                       ng-model="toolForm.skipStaticPayload"
                       style="margin:0;">
                <span style="font-size:13px; color:#374151;">Skip static input values for this tool</span>
            </label>
            <div ng-if="toolForm.skipStaticPayload"
                 style="padding:10px 12px; border:1px dashed #d8dce8; border-radius:10px; color:#6b7280; font-size:13px; background:#fcfcfe;">
                Static input values will not be prefilled when this tool is attached.
            </div>
            <div id="toolVariableInputs" ng-if="!toolForm.skipStaticPayload"></div>
        </div>
    </div>

    <div ng-if="toolForm.selectedToolSource === 'MCP'">

        <div class="form-group row">
            <label class="col-sm-4 entire_toggletitle align-self-start pt-2">Authentication</label>
            <div class="col-sm-8">
                <label style="display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid #e7e7ef; border-radius:10px; background:#fafbff; margin-bottom:12px; cursor:pointer;">
                    <input type="checkbox"
                           ng-model="toolForm.skipAuthInfo"
                           style="margin:0;">
                    <span style="font-size:13px; color:#374151;">This tool does not need additional authentication</span>
                </label>
                <div ng-if="toolForm.skipAuthInfo"
                     style="padding:10px 12px; border:1px dashed #d8dce8; border-radius:10px; color:#6b7280; font-size:13px; background:#fcfcfe;">
                    No extra authentication settings will be saved for this tool.
                </div>
            </div>
        </div>

        <!-- OIDC — full config -->
        <div class="form-group row" ng-if="toolForm.mcpAuth.type === 'OIDC' && !toolForm.skipAuthInfo">
            <label class="col-sm-4 entire_toggletitle mt-2 align-self-start">OIDC Config:</label>
            <div class="col-sm-8">
                <div class="row">
                    <div class="col-sm-6 mb-3">
                        <label>Issuer</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.oidc.issuer"
                               placeholder="https://auth.example.com" />
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label>Client ID</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.oidc.client_id"
                               placeholder="your-client-id" />
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label>Client Secret</label>
                        <input class="input_form" type="password"
                               ng-model="toolForm.mcpAuth.config.oidc.client_secret"
                               placeholder="your-client-secret" />
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label>Redirect URI</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.oidc.redirect_uri"
                               placeholder="https://yourapp.com/callback" />
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label>Scopes</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.oidc.scopesText"
                               placeholder="openid, profile, email" />
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label>Response Type</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.oidc.response_type"
                               placeholder="code" />
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label>Grant Type</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.oidc.grant_type"
                               placeholder="authorization_code" />
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label>Token Endpoint</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.oidc.token_endpoint"
                               placeholder="https://auth.example.com/oauth/token" />
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label>Authorization Endpoint</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.oidc.authorization_endpoint"
                               placeholder="https://auth.example.com/oauth/authorize" />
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label>Userinfo Endpoint</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.oidc.userinfo_endpoint"
                               placeholder="https://auth.example.com/oauth/userinfo" />
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label>JWKS URI</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.oidc.jwks_uri"
                               placeholder="https://auth.example.com/.well-known/jwks.json" />
                    </div>

                    <div class="col-sm-12 mb-3">
                        <button type="button" class="btn btn-primary"
                                ng-click="generateToolMcpOidcToken()"
                                ng-disabled="toolMcpOidcTokenInProgress">
                            {{ toolMcpOidcTokenInProgress ? 'Generating Token...' : 'Generate Token' }}
                        </button>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-sm-12 mb-2">
                        <label class="mb-1 d-block">Tokens</label>
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label>Access Token</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.oidc.tokens.access_token"
                               placeholder="Access token" />
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label>Refresh Token</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.oidc.tokens.refresh_token"
                               placeholder="Refresh token" />
                    </div>
                    <div class="col-sm-4 mb-3">
                        <label>Token Type</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.oidc.tokens.token_type"
                               placeholder="Bearer" />
                    </div>
                    <div class="col-sm-4 mb-3">
                        <label>Expires In</label>
                        <input class="input_form" type="number"
                               ng-model="toolForm.mcpAuth.config.oidc.tokens.expires_in"
                               placeholder="3600" />
                    </div>
                    <div class="col-sm-4 mb-3">
                        <label>Expires At</label>
                        <input class="input_form" type="number"
                               ng-model="toolForm.mcpAuth.config.oidc.tokens.expires_at"
                               placeholder="1700000000" />
                    </div>
                    <div class="col-sm-12 mb-3">
                        <label>Token Scope</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.oidc.tokens.scope"
                               placeholder="openid, profile, email" />
                    </div>
                </div>
            </div>
        </div>

        <!-- API Key -->
        <div class="form-group row" ng-if="toolForm.mcpAuth.type === 'API_KEY' && !toolForm.skipAuthInfo">
            <label class="col-sm-4 entire_toggletitle align-self-start pt-2"></label>
            <div class="col-sm-8">
                <div class="row">
                    <div class="col-sm-4 mb-3">
                        <label>Header Name</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.api_key.header_name"
                               placeholder="X-API-KEY" />
                    </div>
                    <div class="col-sm-4 mb-3">
                        <label>Key</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.api_key.key"
                               placeholder="your-api-key" />
                    </div>
                    <div class="col-sm-4 mb-3">
                        <label>Prefix</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.api_key.prefix"
                               placeholder="Optional prefix" />
                    </div>
                </div>
            </div>
        </div>

        <!-- Basic -->
        <div class="form-group row" ng-if="toolForm.mcpAuth.type === 'BASIC' && !toolForm.skipAuthInfo">
            <label class="col-sm-4 entire_toggletitle align-self-start pt-2"></label>
            <div class="col-sm-8">
                <div class="row">
                    <div class="col-sm-4 mb-3">
                        <label>Username</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.basic.username"
                               placeholder="your-username" />
                    </div>
                    <div class="col-sm-4 mb-3">
                        <label>Password</label>
                        <input class="input_form" type="password"
                               ng-model="toolForm.mcpAuth.config.basic.password"
                               placeholder="your-password" />
                    </div>
                    <div class="col-sm-4 mb-3">
                        <label>Encode</label>
                        <input class="input_form" type="text"
                               ng-model="toolForm.mcpAuth.config.basic.encode"
                               placeholder="base64" />
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Submit -->
    <div class="text-center mt-4">
        <button type="submit" class="create_btn">Create</button>
    </div>

</form>
