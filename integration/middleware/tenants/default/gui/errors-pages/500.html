<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>500 | Internal Server Error</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(90deg, #ffffff 55%, #EAF7FB 45%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 40px;
        }

        .content {
            max-width: 460px;
        }

        .badge {
            display: inline-block;
            background: #E0E7FF;
            color: #3730A3;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .content h1 {
            font-size: 64px;
            margin: 0;
            color: #4F46E5;
            line-height: 1;
        }

        .content h2 {
            font-size: 26px;
            margin: 16px 0 10px;
            color: #1F2937;
        }

        .content p {
            font-size: 16px;
            color: #6B7280;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #0B5ED7;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #094BB5;
        }

        .btn-outline {
            border: 1px solid #D1D5DB;
            color: #1F2937;
            background: #ffffff;
        }

        .btn-outline:hover {
            background: #F3F4F6;
        }

        .illustration {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            max-width: 380px;
            width: 100%;
        }

        @media (max-width: 900px) {
            body {
                background: #ffffff;
            }

            .container {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .content {
                margin: 0 auto;
            }

            .actions {
                justify-content: center;
            }
        }
    </style>
    <script type="syncloop/analytics"></script>
</head>
<body>
<script type="syncloop/body-analytics"></script>
<div class="container">
    <!-- LEFT CONTENT -->
    <div class="content">
        <!-- Logo placeholder -->
        <!-- <img src="logo.svg" alt="Syncloop Logo" /> -->

        <span class="badge">Server Error</span>

        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>
            Something went wrong on our side.
            Our system ran into an unexpected condition,
            but the issue has been logged and we’re working on it.
        </p>

        <div class="actions">
            <a href="/" class="btn btn-primary">Try Again</a>
            <a href="javascript:location.reload()" class="btn btn-outline">Refresh Page</a>
        </div>
    </div>

    <!-- RIGHT ILLUSTRATION -->
    <div class="illustration">
        <!-- Inline SVG – Server + warning -->
        <svg viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg">
            <circle cx="160" cy="150" r="140" fill="#EAF7FB"/>

            <!-- Server -->
            <rect x="100" y="90" width="120" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
            <rect x="100" y="140" width="120" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
            <rect x="100" y="190" width="120" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

            <!-- Lights -->
            <circle cx="120" cy="110" r="4" fill="#22C55E"/>
            <circle cx="120" cy="160" r="4" fill="#F59E0B"/>
            <circle cx="120" cy="210" r="4" fill="#EF4444"/>

            <!-- Warning -->
            <polygon points="240,130 260,170 220,170" fill="#FEE2E2"/>
            <line x1="240" y1="145" x2="240" y2="160" stroke="#DC2626" stroke-width="3"/>
            <circle cx="240" cy="165" r="2.5" fill="#DC2626"/>
        </svg>
    </div>
</div>

</body>
</html>
