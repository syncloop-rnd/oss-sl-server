# Local development server configuration.
# Start with this config folder, for example:
#   java ... com.eka.middleware.server.MiddlewareServer C:/Dev/syncloop-distributions-main/resources/config

middleware.server.home.dir=/oss-sl-server/integration/middleware/
ignite.workingDirectory.path=/oss-sl-server/ignite

middleware.host.name=http://localhost:8080
middleware.server.remote_ip=127.0.0.1
middleware.server.http.ports=8080

# Enable HTTPS only when a local keystore exists.
#middleware.server.https.ports=8443
#middleware.server.keyStore.jks=/oss-sl-server/resources/config/syncloop.jks
#middleware.server.keyStore.jks.password=

# Runtime and Undertow sizing for local development.
middleware.server.thread.resources=20
middleware.server.runtime.threads=200
middleware.server.rest.maxActiveRequests=200
middleware.server.datapipeline.async.threads=100
middleware.server.worker.Options.WORKER_IO_THREADS=8
middleware.server.worker.Options.WORKER_TASK_CORE_THREADS=20
middleware.server.worker.Options.WORKER_TASK_MAX_THREADS=200
middleware.server.worker.Options.TCP_NODELAY=true
middleware.server.worker.Options.REUSE_ADDRESSES=true
middleware.server.worker.Options.CONNECTION_HIGH_WATER=2000
middleware.server.worker.Options.CONNECTION_LOW_WATER=1500
middleware.server.worker.Options.BACKLOG=4096
middleware.server.UndertowOptions.MAX_PARAMETERS=1000

# Tenant startup behavior.
# Keep non-default tenants lazy locally so first boot does not run every tenant startup service.
middleware.server.tenant.batchloader.size=5
middleware.server.tenant.eager.startup.enable=false
middleware.server.tenant.startup.service.enable=false
middleware.server.tenant.lazy.scheduler.enable=true
middleware.server.tenant.lazy.startup.service.enable=true
middleware.server.tenant.lazy.rotateKeys.enable=true
middleware.server.tenant.request.wait.ms=30000
middleware.server.tenant.all.applogger.enable=false
middleware.server.db.user.ignite.migration=false

# Embedded Ignite.
# In embedded mode Syncloop starts the Ignite server node in this JVM, then opens a thin client to it.
middleware.ignite.mode=embedded
middleware.ignite.client.mode=false
middleware.ignite.local.host=127.0.0.1
middleware.accessible.cluster.nodes=127.0.0.1:48500
middleware.accessible.cluster.port=48500
middleware.accessible.cluster.comm.port=48100
middleware.accessible.cluster.comm.port.range=20
middleware.ignite.discovery.joinTimeout.ms=30000
middleware.ignite.thinClient.addresses=127.0.0.1:10800
middleware.ignite.thinClient.port=10800
middleware.ignite.thinClient.startup.maxWait.ms=300000
middleware.ignite.thinClient.startup.retryDelay.ms=3000
middleware.ignite.thinClient.handshakeTimeout.ms=10000
middleware.ignite.thinClient.connectTimeout.ms=10000
middleware.ignite.thinClient.requestTimeout.ms=30000
middleware.ignite.thinClient.retryLimit=5

# Keep local Ignite regions small. Increase these for heavier local data tests.
middleware.offheap.dataStorage.size.gb.initial=0.25
middleware.offheap.dataStorage.size.gb.max=1
middleware.offheap.dataStorage.size.gb.initial.persisted=0.25
middleware.offheap.dataStorage.size.gb.max.persisted=1

# Client-side Ignite throttles. These prevent request storms from blocking the server indefinitely.
middleware.ignite.sql.maxConcurrentOperations=32
middleware.ignite.sql.acquireTimeout.ms=30000
middleware.ignite.cache.maxConcurrentOperations=64
middleware.ignite.cache.acquireTimeout.ms=30000
middleware.ignite.sql.topology.quiet.ms=1000
middleware.ignite.sql.topology.maxWait.ms=5000

# Optional local RDBMS cache-store backing.
# Leave these commented for simple embedded Ignite local development. If enabled,
# MiddlewareServer validates the datasource before starting embedded Ignite.
#middleware.ignite.rdbms.jdbc_url=jdbc:postgresql://localhost:5432/syncloop
#middleware.ignite.rdbms.user=postgres
#middleware.ignite.rdbms.password=
#middleware.ignite.rdbms.connectionPool=10
