# Apache Artemis JMS client configuration for Syncloop queues.
# This file must live in the same config folder as server.properties.

# Broker mode.
# embedded: starts an in-process Artemis broker in this JVM.
# remote: connects to middleware.artemis.url; url is mandatory in remote mode.
middleware.artemis.mode=embedded

# Broker connection.
# In embedded mode this is optional and defaults to tcp://localhost:61616.
# In remote mode this is mandatory; point it to the external Artemis broker or HA endpoint.
# Keep reconnectAttempts=-1 so consumers/producers keep reconnecting after broker restarts.
middleware.artemis.url=tcp://localhost:61616?reconnectAttempts=-1&retryInterval=1000&retryIntervalMultiplier=2.0&maxRetryInterval=30000&blockOnDurableSend=true&connectionTTL=60000&clientFailureCheckPeriod=30000&callTimeout=30000

# Embedded broker settings. Used only when middleware.artemis.mode=embedded.
middleware.artemis.embedded.connection.url=vm://0
middleware.artemis.embedded.invm.acceptor.url=vm://0
middleware.artemis.embedded.invm.server.id=0
middleware.artemis.embedded.acceptor.url=tcp://0.0.0.0:61616
middleware.artemis.embedded.data.dir=./artemis-data
middleware.artemis.embedded.persistence.enabled=true
middleware.artemis.embedded.security.enabled=false
middleware.artemis.embedded.journal.type=NIO

# Set these when broker authentication is enabled.
#middleware.artemis.username=
#middleware.artemis.password=

# Queue names.
middleware.artemis.async.queue=syncloop.async.tasks
middleware.artemis.email.queue=syncloop.email.tasks

# Consumer sizing.
# Increase this only after measuring DB/Ignite/cache pressure, because each consumer can execute middleware services.
middleware.artemis.consumers=10
middleware.artemis.receive.timeout.ms=1000
middleware.artemis.consumer.reconnect.delay.ms=1000

# Message delivery.
# Persistent delivery requires Artemis broker persistence/journal to be enabled.
middleware.artemis.delivery.persistent=true
middleware.artemis.message.priority=4
middleware.artemis.message.ttl.ms=0
